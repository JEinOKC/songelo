<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = n => n.toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const tip = $('tip');
const showTip = (h, x, y) => { tip.innerHTML = h; tip.hidden = false; const r = tip.getBoundingClientRect(); let L = x + 14, T = y + 14; if (L + r.width > innerWidth - 8) L = x - r.width - 14; if (T + r.height > innerHeight - 8) T = y - r.height - 14; tip.style.left = Math.max(8, L) + 'px'; tip.style.top = Math.max(8, T) + 'px'; };
const hideTip = () => { tip.hidden = true; };
const COLORS = ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6'];

let WEEKS = [], SONGS = [];

function decode(raw) {
  // [title, performer, firstWeek, weekDeltas, scoreDeltas, positions] -> points [[week, score, pos]]
  const [title, performer, w0, dw, dr, pos] = raw;
  const pts = []; let w = w0, r = 0;
  for (let i = 0; i < dw.length; i++) { w += dw[i]; r += dr[i]; pts.push([w, r, pos[i]]); }
  let peak = -1e9, peakI = 0, best = 101;
  pts.forEach((p, i) => { if (p[1] > peak) { peak = p[1]; peakI = i; } best = Math.min(best, p[2]); });
  return { title, performer, pts, peak, peakWeek: pts[peakI][0], bestPos: best, year: +WEEKS[w0].slice(0, 4), wk1: pts.filter(p => p[2] === 1).length, key: (title + ' ' + performer).toLowerCase() };
}

// ---------- sortable table ----------
let HLINES = {};
const SORTS = {
  peak: { label: 'Peak score', get: S => S.peak, fmt: v => fmt(v) },
  held: { label: '', get: null, fmt: v => v.toFixed(1) },
  area: { label: 'Area (score-weeks)', get: S => S.m.area, fmt: v => fmt(v) },
  above50: { label: 'Area above #50 line', get: S => S.m.above50, fmt: v => fmt(v) },
  above25: { label: 'Area above #25 line', get: S => S.m.above25, fmt: v => fmt(v) },
  above10: { label: 'Area above #10 line', get: S => S.m.above10, fmt: v => fmt(v) },
  above5: { label: 'Area above #5 line', get: S => S.m.above5, fmt: v => fmt(v) },
  width: { label: 'Width (era-matched weeks)', get: S => S.m.width, fmt: v => v.toFixed(1), big: true },
  riseFast: { label: 'Rise (plain weeks)', get: S => S.m.risefast, fmt: v => fmt(v), asc: true, big: true },
  riseSlow: { label: 'Rise (era-matched weeks)', get: S => S.m.rise, fmt: v => v.toFixed(1), big: true },
  fall: { label: 'Fall (era-matched weeks)', get: S => S.m.fall, fmt: v => v.toFixed(1), big: true },
  margin: { label: 'Margin at peak', get: S => S.m.margin, fmt: v => fmt(v), big: true },
  rivals: { label: 'Rivals’ average score', get: S => S.m.rivals, fmt: v => fmt(v), big: true },
  volatility: { label: 'Weekly swing', get: S => S.m.volatility, fmt: v => v.toFixed(1), big: true },
};
// The five chart eras from the rating lab's change-point search (research/rating-lab,
// expect.py BREAKS). A song belongs to the era of the week it peaked.
const ERA_BREAKS = ['1977-04-23', '1991-11-16', '2008-04-12', '2018-03-03'];
const eraOf = S => ERA_BREAKS.filter(b => WEEKS[S.peakWeek] >= b).length;
const ERAS = [
  { slug: 'am-radio', name: 'AM Radio Era', years: '1958–1977', traits: ['High turnover', 'Short chart runs', 'Frequent #1 changes'] },
  { slug: 'fm-radio', name: 'FM Radio Era', years: '1977–1991', traits: ['Slow climbs', 'Rare debut-week peaks', 'Long chart runs'] },
  { slug: 'soundscan', name: 'SoundScan Era', years: '1991–2008', traits: ['Few new songs', 'Long chart runs', 'Long stays at #1'] },
  { slug: 'download', name: 'Download Era', years: '2008–2018', traits: ['Fast starts', 'Many debut-week peaks'] },
  { slug: 'streaming', name: 'Streaming Era', years: '2018–now', traits: ['Peaks on arrival', 'Album tracks crowd the chart', 'Frequent top-10 debuts'] },
];
let ERA_CACHE = null;
function eraStats() {
  if (ERA_CACHE) return ERA_CACHE;
  const weeks = [0, 0, 0, 0, 0]; WEEKS.forEach(w => weeks[ERA_BREAKS.filter(b => w >= b).length]++);
  ERA_CACHE = ERAS.map((e, k) => ({ ...e, k, weeks: weeks[k], songs: [], ones: 0, wk: 0, debutPeak: 0 }));
  SONGS.forEach((S, i) => {
    const E = ERA_CACHE[eraOf(S)]; E.songs.push(i); E.wk += S.pts.length;
    if (S.bestPos === 1) E.ones++;
    if (S.pts[0][2] === S.bestPos) E.debutPeak++;
  });
  ERA_CACHE.forEach(E => { E.songs.sort((a, b) => SONGS[b].peak - SONGS[a].peak); const yrs = E.weeks / 52.18;
    E.perYear = Math.round(E.songs.length / yrs); E.avgWk = (E.wk / E.songs.length).toFixed(1); E.debutPct = Math.round(E.debutPeak / E.songs.length * 100); E.onesYear = (E.ones / yrs).toFixed(1); });
  return ERA_CACHE;
}
let curEra = null;
function eraStatTiles(E) {
  return `<div class="estats"><div><b>${fmt(E.perYear)}</b><span>new songs a year</span></div><div><b>${E.avgWk}</b><span>avg weeks on chart</span></div><div><b>${E.debutPct}%</b><span>peaked in debut week</span></div><div><b>${E.onesYear}</b><span>#1 hits a year</span></div></div>`;
}
function drawEras() {
  const all = eraStats(), box = $('erasView');
  if (curEra === null) {
    box.innerHTML = all.map(E => `<a class="panel ecard" href="?view=eras&era=${E.slug}" data-era="${E.k}">
      <div class="ehead"><h2>${E.name}</h2><span class="eyears">${E.years}</span></div>
      <ul class="etraits">${E.traits.map(t => `<li>${t}</li>`).join('')}</ul>${eraStatTiles(E)}
      <div class="etop">${E.songs.slice(0, 3).map((i, n) => `<span><b>${n + 1}</b> ${esc(SONGS[i].title)} <span class="muted">· ${esc(SONGS[i].performer)}</span></span>`).join('')}</div>
      <span class="emore">Top 100 ›</span></a>`).join('');
  } else {
    const E = all[curEra];
    const rows = E.songs.slice(0, 100).map((i, n) => songRow(i, n + 1, '', fmt(SONGS[i].peak), SONGS[i].pts.map(p => p[1]))).join('');
    const nav = `<nav class="eswitch" aria-label="Eras"><a href="?view=eras" data-era="">All eras</a>${all.map(x => `<a href="?view=eras&era=${x.slug}" data-era="${x.k}"${x.k === curEra ? ' aria-current="page"' : ''}>${x.name.replace(' Era', '')}</a>`).join('')}</nav>`;
    box.innerHTML = `${nav}<section class="panel"><div class="ehead"><h2 class="big">${E.name}</h2><span class="eyears">${E.years}</span></div><ul class="etraits">${E.traits.map(t => `<li>${t}</li>`).join('')}</ul>${eraStatTiles(E)}</section>
      <section class="panel"><h2>Top 100 of the ${E.name}</h2><p class="small muted">By peak score. Songs count in the era they peaked.</p>
      <div>${rows}</div></section>`;
  }
}
const TYPE_NAMES = { spike: 'Spike', plateau: 'Plateau', sleeper: 'Sleeper', comeback: 'Comeback', seasonal: 'Seasonal', standard: 'Standard', minor: 'Minor' };
function drawTable() {
  const by = $('sortBy').value, lvl = $('heldLvl').value, tf = $('typeF').value, cfg = SORTS[by];
  $('heldLvl').hidden = by !== 'held';
  const get = by === 'held' ? (S => S.m['held' + lvl]) : cfg.get;
  let pool = SONGS.map((S, i) => i).filter(i => (!tf || SONGS[i].m.type === tf));
  if (cfg.big) pool = pool.filter(i => SONGS[i].peak >= HLINES['5']);
  let rows = pool.map(i => [i, get(SONGS[i])]).filter(r => r[1] !== null && r[1] !== undefined && !Number.isNaN(r[1]) && (by !== 'held' || r[1] > 0));
  rows.sort((a, b) => (cfg.asc ? a[1] - b[1] : b[1] - a[1]) || SONGS[b[0]].peak - SONGS[a[0]].peak);
  rows = rows.slice(0, 50);
  $('sortNote').textContent = (cfg.big ? `This sort only includes songs whose score reached the #5 line (${fmt(HLINES['5'])}), so tiny chart runs don’t crowd it.` : '');
  const label = by === 'held' ? `Era-matched straight weeks ≥ #${lvl} line (${fmt(HLINES[lvl])})` : cfg.label;
  $('th').innerHTML = '';
  $('tb').innerHTML = rows.length ? rows.map(([i, v], k) => songRow(i, k + 1, '', cfg.fmt ? cfg.fmt(v) : fmt(Math.round(v)), SONGS[i].pts.map(p => p[1]))).join('')
    : '<div class="empty">No songs match. Try another curve type or a lower threshold.</div>';
}
$('sortBy').onchange = drawTable; $('typeF').onchange = drawTable; $('heldLvl').onchange = drawTable;


// ---------- weekly chart ----------
let BYWEEK = [], RUNS = [], curW = 0, openRow = -1;
function buildWeekly() {
  BYWEEK = WEEKS.map(() => []);
  SONGS.forEach((S, i) => {
    let run = null;
    S.pts.forEach((p, k) => {
      if (!run || p[0] !== S.pts[k - 1][0] + 1) { run = { s: i, first: !run, start: p[0], sc: [], pos: [] }; RUNS.push(run); S.runs = (S.runs || []).concat([run]); }
      run.sc.push(p[1]); run.pos.push(p[2]); run.end = p[0];
      BYWEEK[p[0]].push([p[2], i, k]);
    });
  });
  BYWEEK.forEach(rows => rows.sort((a, b) => a[0] - b[0]));
}
function runAt(S, w) { return S.runs.find(r => r.start <= w && w <= r.end); }
function spark(sc) {
  const w = 70, h = 22, lo = 1000, hi = 3300, n = sc.length;
  const pts = sc.map((v, k) => [n === 1 ? w - 2 : k * (w - 2) / (n - 1), h - 1 - Math.max(0, Math.min(1, (v - lo) / (hi - lo))) * (h - 2)]);
  return `<svg width="${w}" height="${h}" aria-hidden="true"><path d="M${pts.map(p => p.map(x => x.toFixed(1)).join(',')).join('L')}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>${n === 1 ? `<circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="2" fill="var(--accent)"/>` : ''}</svg>`;
}
// Song page slugs, written by the hot100 pipeline beside curves.json (songs/index.json).
let SLUGS = null;
fetch('songs/index.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(s => { SLUGS = s; if (SONGS.length) { drawWeek(); drawTable(); if (!$('erasView').hidden) drawEras(); } }).catch(() => {});
const songHref = i => SLUGS && SLUGS[i] ? `songs/${SLUGS[i]}/` : null;
// One row style for every song list: rank (+ movement), title and artist, a
// number and the song's score line. The row links to the song's page.
function songRow(i, rank, mv, value, sc) {
  const S = SONGS[i], href = songHref(i);
  return `<a class="crow"${href ? ` href="${href}"` : ''}><div class="cpos">${rank}${mv || ''}</div><div><div class="ct">${esc(S.title)}</div><div class="ca">${esc(S.performer)}</div></div><div class="csc">${value}${spark(sc)}</div></a>`;
}
function drawWeek() {
  const w = curW, last = WEEKS.length - 1;
  const d = new Date(WEEKS[w] + 'T00:00:00');
  $('wkLabel').textContent = 'Week of ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  $('wkSub').textContent = w === last ? 'Latest chart' : 'Tap to pick a date';
  $('wkPick').value = WEEKS[w]; $('wkPick').min = WEEKS[0]; $('wkPick').max = WEEKS[last];
  $('prevW').disabled = w === 0; $('nextW').disabled = w === last;
  $('crows').innerHTML = BYWEEK[w].map(([pos, i, k], row) => {
    const S = SONGS[i], prev = k > 0 && S.pts[k - 1][0] === w - 1 ? S.pts[k - 1][2] : null;
    const mv = k === 0 ? '<span class="mv nw">NEW</span>' : prev === null ? '<span class="mv nw">RE</span>'
      : prev === pos ? '<span class="mv">–</span>' : prev > pos ? `<span class="mv up">▲${prev - pos}</span>` : `<span class="mv down">▼${pos - prev}</span>`;
    const run = runAt(S, w);
    return songRow(i, pos, mv, fmt(S.pts[k][1]), run.sc.slice(0, w - run.start + 1));
  }).join('');
}
function setWeek(w) { curW = Math.max(0, Math.min(WEEKS.length - 1, w)); openRow = -1; drawWeek(); saveUrl(); }
function setView(view) {
  const all = view === 'all', eras = view === 'eras';
  $('tabAll').setAttribute('aria-selected', all); $('tabEras').setAttribute('aria-selected', eras); $('tabWeek').setAttribute('aria-selected', !all && !eras);
  $('allView').hidden = !all; $('erasView').hidden = !eras; $('weekView').hidden = all || eras;
  if (eras) drawEras(); saveUrl();
}
function saveUrl() {
  const q = new URLSearchParams();
  if (!$('allView').hidden) q.set('view', 'all');
  else if (!$('erasView').hidden) { q.set('view', 'eras'); if (curEra !== null) q.set('era', ERAS[curEra].slug); }
  else if (curW !== WEEKS.length - 1) q.set('w', WEEKS[curW]);
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
}
$('erasView').addEventListener('click', e => { const a = e.target.closest('[data-era]'); if (!a) return; e.preventDefault(); curEra = a.dataset.era === '' ? null : +a.dataset.era; drawEras(); saveUrl(); scrollTo(0, $('erasView').offsetTop - 80); });
$('prevW').onclick = () => setWeek(curW - 1);
$('nextW').onclick = () => setWeek(curW + 1);
$('wkPick').onchange = e => { const v = e.target.value; if (!v) return; let w = WEEKS.findIndex(x => x > v); setWeek(w === -1 ? WEEKS.length - 1 : Math.max(0, w - 1)); };
$('tabWeek').onclick = () => setView('week');
$('tabAll').onclick = () => setView('all');
$('tabEras').onclick = () => { curEra = null; setView('eras'); };

// ---------- load ----------
fetch('curves.json', { cache: 'no-cache' }).then(r => r.json()).then(D => {
  WEEKS = D.weeks; SONGS = D.songs.map(decode);
  HLINES = D.lines;
  if (D.lines && $('lineV')) $('lineV').textContent = Object.entries(D.lines).filter(([n]) => [50, 25, 10, 5].includes(+n)).sort((a, b) => b[0] - a[0]).map(([n, v]) => `#${n} ${fmt(v)}`).join(', ');
  SONGS.forEach((S, i) => { const v = D.metrics[i]; S.m = Object.fromEntries(D.fields.map((f, k) => [f, v[k]])); if (S.peak < D.lines['10']) S.m.type = 'minor'; });
  drawTable();
  buildWeekly();
  const q = new URLSearchParams(location.search), qw = q.get('w');
  curW = WEEKS.length - 1;
  if (qw) { const w = WEEKS.findIndex(x => x > qw); curW = w === -1 ? WEEKS.length - 1 : Math.max(0, w - 1); }
  const qe = ERAS.findIndex(e => e.slug === q.get('era')); curEra = qe >= 0 ? qe : null;
  drawWeek(); setView(q.get('view') || 'week');
}).catch(() => { $('wkLabel').textContent = 'The chart didn\'t load. Reload the page to try again.'; });
const redraw = () => drawChart();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
