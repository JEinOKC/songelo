name: Upload lab to S3 dev path

on:
  push:
    branches:
    - lab-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # the lab is static, so public/lab is uploaded as-is to /lab-dev.
    # curves.json is written by the hot100 pipeline (dbx serverless/hot100), not this repo.
    - name: Deploy to S3
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --follow-symlinks --delete --exclude 'curves.json'
      env:
        SOURCE_DIR: ./public/lab
        DEST_DIR: lab-dev
        AWS_REGION: us-east-1
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    # The venues page goes to /venues-dev/okc the same way. venues.json, the venue
    # and band pages (subfolders) and sitemap.xml there are written by the concerts
    # pipeline (dbx serverless/concerts, site layer), so the sync leaves them alone.
    - name: Deploy venues to S3 dev path
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --follow-symlinks --delete --exclude 'venues.json' --exclude '*/*' --exclude 'sitemap.xml'
      env:
        SOURCE_DIR: ./public/venues/okc
        DEST_DIR: venues-dev/okc
        AWS_REGION: us-east-1
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
